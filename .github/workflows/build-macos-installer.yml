name: Build iylomilo macOS installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install CMake if needed
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi

      - name: Build universal AU, VST3, and CLAP installer
        run: |
          chmod +x tools/make_installer_mac.sh
          ./tools/make_installer_mac.sh

      - name: Upload the macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: iylomilo-1.0-macOS-universal-installer
          path: dist/*.pkg
          if-no-files-found: error
          retention-days: 14
