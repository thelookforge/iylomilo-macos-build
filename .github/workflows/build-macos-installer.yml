name: Build iylomilo macOS VST3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install CMake if needed
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi

      - name: Build universal VST3 bundle
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^project(iylomilo VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          BUILD="build/macos"
          cmake -S . -B "$BUILD" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DIYLOMILO_COPY_AFTER_BUILD=OFF
          cmake --build "$BUILD" --config Release --parallel "$(sysctl -n hw.ncpu)" --target TheCalm_VST3

          VST3_BUNDLE="$BUILD/TheCalm_artefacts/Release/VST3/iylomilo.vst3"
          test -d "$VST3_BUNDLE"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$VST3_BUNDLE" \
            "dist/iylomilo-$VERSION-macOS-universal-VST3.zip"

      - name: Upload the macOS VST3 bundle
        uses: actions/upload-artifact@v7
        with:
          name: iylomilo-macOS-universal-VST3
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
